<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />

<title>Metaball Detach / Reintegration — Prototype</title>
<style>
  :root { color-scheme: dark; --bg:#050505; --fg:#f7f7f2; --muted:#8f8f89; }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; background:var(--bg); overflow:hidden; }
  body { display:grid; place-items:center; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .scene { width:min(88vmin, 820px); aspect-ratio:1; position:relative; }
  svg { width:100%; height:100%; display:block; overflow:visible; }
  .ui { position:fixed; left:24px; bottom:22px; display:flex; flex-direction:column; gap:5px; pointer-events:none; user-select:none; }
  .title { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#deded8; }
  .meta { font-size:11px; color:#6f6f6a; }
  .replay { position:fixed; right:22px; bottom:20px; border:1px solid #2a2a29; background:#0d0d0d; color:#d9d9d4; border-radius:999px; padding:9px 13px; font:500 11px/1 system-ui; letter-spacing:.03em; cursor:pointer; }
  .replay:hover { background:#151515; }
</style>
</head>
<body>
<div class="scene">
<svg id="logoSvg" viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg" aria-label="Animated organic logo loader">
  <defs>

65.262 1020.469 1687.759 1000.120 1706.742 977.258 C 1725.725 954.396 1741.193 929.019 1753.377 902.623 C 1765.561 876.227 1774.463 848.811 1779.000 819.285 C 1783.537 789.758 1783.711 758.121 1780.000 728.232 C 1776.289 698.344 1768.694 670.204 1756.864 643.864 C 1745.034 617.523 1728.969 592.982 1708.936 570.936 C 1688.903 548.889 1664.901 529.337 1639.523 514.523 C 1614.144 499.708 1587.389 489.632 1558.151 484.151 C 1528.913 478.671 1497.191 477.786 1467.161 481.000 C 1437.132 484.214 1408.794 491.525 1382.322 503.000 C 1355.851 514.475 1331.246 530.113 1306.836 546.164 C 1282.425 562.216 1258.210 578.681 1230.627 589.000 C 1203.043 599.319 1172.091 603.492 1142.474 601.000 C 1112.857 598.508 1084.576 589.350 1059.292 575.000 C 1034.008 560.650 1011.722 541.109 993.000 518.636 C 974.278 496.164 959.122 470.759 948.000 443.910 C 936.878 417.061 929.792 388.766 924.000 359.899 C 918.208 331.032 913.711 301.592 904.871 273.871 C 896.031 246.150 882.849 220.149 865.307 196.307 C 847.765 172.465 825.862 150.780 801.894 133.894 C 777.926 117.007 751.892 104.918 723.158 97.158 C 694.425 89.398 662.991 85.968 633.000 88.000 Z"/>

    <!-- Recorta apenas o lóbulo inferior esquerdo. -->
    <clipPath id="lobeClip" clipPathUnits="userSpaceOnUse">
      <ellipse cx="515" cy="1295" rx="322" ry="330"/>
    </clipPath>

    <!-- A base perde temporariamente o lóbulo; a cópia de regeneração o recompõe. -->
    <mask id="baseMask" maskUnits="userSpaceOnUse" x="0" y="0" width="2000" height="2000">
      <rect width="2000" height="2000" fill="white"/>
      <ellipse id="vacancy" cx="515" cy="1295" rx="0" ry="0" fill="black"/>
    </mask>

    <!-- Pequena distorção orgânica só na gota viajante. -->
    <filter id="softBlob" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feTurbulence id="noise" type="fractalNoise" baseFrequency="0.006 0.008" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- Logo principal -->
  <use href="#logoShape" fill="var(--fg)" mask="url(#baseMask)"/>

  <!-- Regeneração: uma cópia EXATA do trecho original cresce no lugar. -->
  <g clip-path="url(#lobeClip)">
    <use id="regen" href="#logoShape" fill="var(--fg)" opacity="0"/>
  </g>

  <!-- Pescoço elástico durante o desprendimento -->
  <path id="tether" d="M760 1190 C700 1210 645 1250 585 1280" fill="none" stroke="var(--fg)" stroke-width="0" stroke-linecap="round" opacity="0"/>

  <!-- Gota viajante: usa o próprio pedaço vetorial da marca -->
  <g id="traveler" opacity="0" filter="url(#shadow)">
    <g id="travelerSquish" filter="url(#softBlob)">
      <g clip-path="url(#lobeClip)">
        <use href="#logoShape" fill="var(--fg)"/>
      </g>
    </g>
  </g>

  <!-- pequeno impacto de reintegração -->
  <ellipse id="impact" cx="515" cy="1295" rx="290" ry="305" fill="none" stroke="var(--fg)" stroke-width="14" opacity="0"/>
</svg>
</div>

<div class="ui">
  <div class="title">Metaball detach / reintegration</div>
  <div class="meta">prototype · lower-left lobe · 4.6s loop</div>
</div>
<button class="replay" id="replay">replay</button>

<script>
(() => {
  const svg = document.getElementById('logoSvg');
  const traveler = document.getElementById('traveler');
  const travelerSquish = document.getElementById('travelerSquish');
  const vacancy = document.getElementById('vacancy');
  const regen = document.getElementById('regen');
  const tether = document.getElementById('tether');
  const impact = document.getElementById('impact');
  const replay = document.getElementById('replay');
  const noise = document.getElementById('noise');
  const disp = document.getElementById('disp');

  const cx = 515, cy = 1295;
  const cycle = 4600;
  const rest = 900;
  let start = performance.now();
  let raf = 0;
  let manualRestart = false;

  const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
  const mix = (a,b,t) => a + (b-a)*t;
  const ease = t => 0.5 - Math.cos(Math.PI*clamp(t))/2;
  const easeOut = t => 1-Math.pow(1-clamp(t),3);
  const easeInOutQuart = t => t<.5 ? 8*t*t*t*t : 1-Math.pow(-2*t+2,4)/2;
  const smooth = t => { t=clamp(t); return t*t*(3-2*t); };
  const local = (t,a,b) => clamp((t-a)/(b-a));

  function cubic(p0,p1,p2,p3,t) {
    const u=1-t, tt=t*t, uu=u*u;
    return {
      x: uu*u*p0.x + 3*uu*t*p1.x + 3*u*tt*p2.x + tt*t*p3.x,
      y: uu*u*p0.y + 3*uu*t*p1.y + 3*u*tt*p2.y + tt*t*p3.y
    };
  }

  // Um loop assimétrico: início contemplativo, retorno deliberadamente rápido.
  const A={x:cx,y:cy};
  const B={x:225,y:1115};
  const C={x:315,y:435};
  const D={x:965,y:235};
  const E={x:1705,y:650};
  const F={x:1570,y:1430};
  const G={x:1050,y:1690};
  const H={x:690,y:1540};

  function route(u) {
    // 0..0.62 = volta ampla; 0.62..1 = retorno rápido em duas curvas.
    if (u < .22) return cubic(A, {x:370,y:1275}, {x:175,y:900}, C, u/.22);
    if (u < .43) return cubic(C, {x:450,y:245}, {x:760,y:150}, D, (u-.22)/.21);
    if (u < .62) return cubic(D, {x:1260,y:220}, {x:1695,y:430}, E, (u-.43)/.19);
    if (u < .79) return cubic(E, {x:1830,y:1000}, {x:1720,y:1330}, F, (u-.62)/.17);
    if (u < .90) return cubic(F, {x:1450,y:1640}, {x:1190,y:1710}, G, (u-.79)/.11);
    if (u < .96) return cubic(G, {x:890,y:1690}, {x:740,y:1600}, H, (u-.90)/.06);
    return cubic(H, {x:610,y:1490}, {x:555,y:1360}, A, (u-.96)/.04);
  }

  function transformAround(x,y,sx,sy,rot=0) {
    const dx=x-cx, dy=y-cy;
    return `translate(${dx} ${dy}) translate(${cx} ${cy}) rotate(${rot}) scale(${sx} ${sy}) translate(${-cx} ${-cy})`;
  }

  function resetExact() {
    traveler.setAttribute('opacity','0');
    traveler.setAttribute('transform','');
    travelerSquish.setAttribute('transform','');
    vacancy.setAttribute('rx','0'); vacancy.setAttribute('ry','0');
    regen.setAttribute('opacity','0'); regen.setAttribute('transform','');
    tether.setAttribute('opacity','0'); tether.setAttribute('stroke-width','0');
    impact.setAttribute('opacity','0'); impact.setAttribute('transform','');
    disp.setAttribute('scale','9');
  }

  function frame(now) {
    const elapsed = (now-start) % (cycle+rest);
    if (elapsed >= cycle) {
      resetExact();
      raf=requestAnimationFrame(frame); return;
    }
    const t = elapsed/cycle;

    // 1) DESPRENDIMENTO (0 -> .17)
    const detach = smooth(local(t,0,.17));
    const cut = easeOut(local(t,.035,.15));
    vacancy.setAttribute('rx', String(322*cut));
    vacancy.setAttribute('ry', String(330*cut));

    // 2) REGENERAÇÃO (.09 -> .31) — cópia exata do próprio vetor.
    const rg = easeOut(local(t,.09,.31));
    const overshoot = rg < .82 ? mix(.05,1.06, easeOut(rg/.82)) : mix(1.06,1,(rg-.82)/.18);
    regen.setAttribute('opacity', rg > .01 ? '1':'0');
    regen.setAttribute('transform', `translate(${cx} ${cy}) scale(${overshoot}) translate(${-cx} ${-cy})`);

    // Pescoço de gosma: cresce e rompe.
    const neckIn = easeOut(local(t,.015,.085));
    const neckOut = 1-ease(local(t,.085,.17));
    const neck = neckIn*neckOut;
    tether.setAttribute('opacity', String(neck*.92));
    tether.setAttribute('stroke-width', String(145*neck));

    // 3) TRAJETÓRIA (.04 -> .71), com retorno muito acelerado no final do percurso.
    const travelT = local(t,.04,.71);
    const p = route(travelT);
    const ahead = route(Math.min(1, travelT+.003));
    const angle = Math.atan2(ahead.y-p.y,ahead.x-p.x)*180/Math.PI;

    // entrada lenta + saída lenta; a gota nunca vira um fantasma no meio do percurso.
    const alphaIn = ease(local(t,.025,.18));
    const alphaOut = 1-ease(local(t,.66,.82));
    const alpha = clamp(Math.min(alphaIn,alphaOut));
    traveler.setAttribute('opacity', String(alpha));

    // Squash & stretch conforme a velocidade: alonga na volta rápida.
    const speed = Math.hypot(ahead.x-p.x, ahead.y-p.y)/.003;
    const speedN = clamp((speed-1100)/5000);
    const pulse = Math.sin(travelT*Math.PI*6)*.025;
    const sx = 1 + speedN*.15 + pulse;
    const sy = 1 - speedN*.11 - pulse*.45;
    traveler.setAttribute('transform', transformAround(p.x,p.y,sx,sy,angle*.045));

    // Micro deformação interna, muito sutil para não descaracterizar a marca.
    const wobble = 1 + Math.sin(now/240)*.017;
    travelerSquish.setAttribute('transform', `translate(${cx} ${cy}) scale(${wobble} ${2-wobble}) translate(${-cx} ${-cy})`);
    disp.setAttribute('scale', String(7 + 6*speedN));
    noise.setAttribute('baseFrequency', `${(0.006+speedN*.002).toFixed(4)} ${(0.008-speedN*.001).toFixed(4)}`);

    // 4) IMPACTO / ABSORÇÃO quando a gota toca o lóbulo regenerado.
    const hit = local(t,.695,.86);
    if (hit>0 && hit<1) {
      const wave = Math.sin(Math.PI*hit);
      const sxI = 1 + .11*wave;
      const syI = 1 - .07*wave;
      regen.setAttribute('transform', `translate(${cx} ${cy}) scale(${sxI} ${syI}) translate(${-cx} ${-cy})`);
      impact.setAttribute('opacity', String(.14*wave));
      const ring = 1 + .24*easeOut(hit);
      impact.setAttribute('transform', `translate(${cx} ${cy}) scale(${ring}) translate(${-cx} ${-cy})`);
    } else {
      impact.setAttribute('opacity','0');
    }

    // 5) volta silenciosamente ao SVG original, pixel por pixel.
    const settle = ease(local(t,.84,.96));
    if (settle>0) {
      vacancy.setAttribute('rx', String(322*(1-settle)));
      vacancy.setAttribute('ry', String(330*(1-settle)));
      regen.setAttribute('opacity', String(1-settle));
    }

    raf=requestAnimationFrame(frame);
  }

  replay.addEventListener('click', () => {
    start=performance.now();
    resetExact();
  });

  resetExact();
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
